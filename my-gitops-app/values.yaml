replicaCount: 1

image:
  repository: rpawar2025/gitops-demo-app
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

serviceAccount:
  create: false

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  APP_VERSION: "v1.0.0"

ingress:
  enabled: false
  
httpRoute:
  enables: false

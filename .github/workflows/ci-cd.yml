name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: |
          python -m pytest -v

  helm-lint:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Helm Lint
        run: |
          helm lint ./my-gitops-app

  build-and-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: helm-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:v1.0.0 \
            .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push SHA Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${{ github.sha }}

      - name: Push Version Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:v1.0.0
